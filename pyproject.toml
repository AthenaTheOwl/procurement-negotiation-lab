[project]
name = "procurement-negotiation-lab"
version = "0.3.0"
description = "A React learning simulator for long-lead procurement coordination."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Vignesh Gopalakrishnan" }]
dependencies = [
    "altair>=5.5.0",
    "gitpython>=3.1.50",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "bandit>=1.7.10",
    "hypothesis>=6.115.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.3",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "types-PyYAML>=6.0.12.20240917",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
flopro = [
    # FloPro SDK/ADK are not published to PyPI yet. See docs/flopro.md for
    # local install notes. The hosted app uses the pure-Python ADMM reference.
]
factory = [
    # Optional orchestration and MCP SDKs for the in-repo development factory.
    # The committed factory has safe fallbacks and does not require these for
    # normal tests or hosted app deploys.
    "langgraph>=1.0.0",
    "mcp>=1.27.1",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["_legacy"]   # reference-only code from the pre-redesign engine

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607"]
"scripts/factory/worktree.py" = ["S607"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
packages = ["procurement_lab"]

[[tool.mypy.overrides]]
module = ["pandas.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src/procurement_lab --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_lab"]
