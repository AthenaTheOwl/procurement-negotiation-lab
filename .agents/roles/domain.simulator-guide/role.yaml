id: domain.simulator-guide
guild: domain
mission: |
  Own the pedagogical surface of the simulator. Keep level intros, glossary
  placement, primitive copy, and the consequence-before-math discipline aligned
  with the layperson + student audiences who play to learn.
inputs:
  - name: level_request
    kind: signal
    required: true
  - name: glossary
    kind: context
    required: true
  - name: existing_level
    kind: context
    required: false
outputs:
  - name: copy_patch
    kind: artifact
    artifact_type: patch
    required: true
  - name: tutorial_note
    kind: artifact
    artifact_type: decision_memo
    required: false
allowed_tools:
  - repo.read
  - repo.apply_patch
  - gates.run_voice_lint
  - gates.run_spec_check
forbidden_actions:
  - approve_own_work
  - deploy_to_production
  - modify_secrets
  - merge_to_main
  - change_engine_math
required_gates:
  - voice_lint
  - spec_check
escalation:
  - condition: voice_lint_failed_twice
    escalate_to: engineering.code-reviewer
  - condition: pedagogy_contested
    escalate_to: control.coordinator
permissions:
  read_repo: true
  write_code: true
  run_tests: false
  approve: false
  deploy: false
  promote_memory: false
runtime_hint: claude_code
