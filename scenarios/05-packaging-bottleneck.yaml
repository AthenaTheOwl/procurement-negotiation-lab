id: packaging-bottleneck
title: Advanced-packaging capacity bottleneck (firm-commit penalty exposure)
n_periods: 1
currency: USD
risk_score: 0.5
evidence_ids:
  - tsm-10k-cowos-capacity

products:
  - id: hbm-interposer
    name: HBM-3 interposer package
    demand_mean: 320.0
    demand_std: 55.0
    unit_value: 280.0

capacity:
  hbm-interposer: 350.0

participants:
  - id: buyer-vela
    name: Vela Compute
    role: buyer
    outside_option: 0.0
    utility_formula: >-
      service_level_value * min(q, demand)
      - unit_price * q
      - shortage_penalty * max(demand - q, 0)
      - inventory_penalty * max(q - demand, 0)
      - firm_commit_cost * max(q - committed, 0)
    parameters:
      service_level_value: 280.0
      unit_price: 165.0
      shortage_penalty: 240.0
      inventory_penalty: 12.0
      firm_commit_cost: 30.0
      committed: 280.0

  - id: supplier-cinder
    name: Cinder Lithography Services
    role: supplier
    outside_option: 0.0
    utility_formula: >-
      revenue_per_unit * q
      - production_cost * q
      - holding_cost * max(q - demand, 0)
      - stockout_penalty * max(demand - q, 0)
      - risk_premium * risk_score * q
      - capacity_strain * max(q - capacity, 0)
    parameters:
      revenue_per_unit: 165.0
      production_cost: 95.0
      holding_cost: 8.0
      stockout_penalty: 18.0
      risk_premium: 22.0
      capacity_strain: 25.0
      capacity: 350.0
