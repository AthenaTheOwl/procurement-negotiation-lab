id: multi-period-commitment
title: Four-quarter commitment schedule with decaying forecast confidence
n_periods: 4
currency: USD
risk_score: 0.3
evidence_ids: []

products:
  - id: ai-substrate-A
    name: AI accelerator substrate, generation A
    demand_mean: 500.0
    demand_std: 100.0
    unit_value: 100.0

capacity:
  ai-substrate-A: 800.0

participants:
  - id: buyer-northstar
    name: Northstar Substrates
    role: buyer
    outside_option: 0.0
    utility_formula: >-
      service_level_value * min(q, demand)
      - unit_price * q
      - shortage_penalty * max(demand - q, 0)
      - inventory_penalty * max(q - demand, 0)
    parameters:
      service_level_value: 100.0
      unit_price: 50.0
      shortage_penalty: 80.0
      inventory_penalty: 5.0

  - id: supplier-cinder
    name: Cinder Lithography Services
    role: supplier
    outside_option: 0.0
    utility_formula: >-
      revenue_per_unit * q
      - production_cost * q
      - holding_cost * max(q - demand, 0)
      - stockout_penalty * max(demand - q, 0)
      - risk_premium * risk_score * q
    parameters:
      revenue_per_unit: 50.0
      production_cost: 30.0
      holding_cost: 3.0
      stockout_penalty: 6.0
      risk_premium: 12.0
