      id: "settle-button"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settle-button"
- scrollUntilVisible:
    element:
      id: "level-reveal"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
