# Level 11 (mobile) - mechanism catalog.
#
# NOTE: This flow walks Levels 1-10 to reach the final catalog from a
# fresh install. The Level 11 gate is accepted && visited.size >= 4.

- launchApp:
    clearState: true
    stopApp: true

- extendedWaitUntil:
    visible:
      id: "home-surface"
    timeout: 60000
- tapOn:
    id: "home-start-cta"

# Fast path through Levels 1-9.
