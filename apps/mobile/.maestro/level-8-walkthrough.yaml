appId: com.athenatheowl.proclab
name: Level 8 walkthrough
tags:
  - learn
  - level-8
  - smoke
---
# Level 8 (mobile) - formula editor + parameters.
#
# NOTE: This flow walks Levels 1-7 to reach Level 8 from a fresh install.
# The Level 8 gate is editedFormula || editedParams; the flow changes a
# parameter knob and waits for the graduation card.

- launchApp:
    clearState: true
    stopApp: true

- assertVisible:
    id: "home-surface"
- tapOn:
    id: "home-start-cta"

# Level 1.
- assertVisible:
    id: "level-shell-1"
- scrollUntilVisible:
    element:
      id: "settle-button"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settle-button"
- scrollUntilVisible:
    element:
      id: "level-reveal"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "level-reveal"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "level-continue"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "level-continue"

# Level 2.
- extendedWaitUntil:
    visible:
      id: "level-shell-2"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "quantity-knob-increase"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "quantity-knob-increase"
- scrollUntilVisible:
    element:
      id: "predict-reveal-button"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "predict-reveal-button"
- scrollUntilVisible:
    element:
      id: "predict-reveal-truth"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "predict-reveal-truth"
- scrollUntilVisible:
    element:
      id: "level-continue"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "level-continue"

