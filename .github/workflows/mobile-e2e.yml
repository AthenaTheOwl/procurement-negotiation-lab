# mobile-e2e: Tier 2 native E2E for apps/mobile (Spec 0012, R-MOBREL-003).
#
# NOTE on approach:
# This workflow runs `npx expo prebuild` to generate the native `android/`
# project on the runner, then `./gradlew assembleRelease` to produce a release
# APK. The APK is installed on a KVM-accelerated hosted Android emulator
# via reactivecircus/android-emulator-runner@v2, and Maestro is invoked
# against `apps/mobile/.maestro/`. This avoids depending on EAS Cloud
# (which costs credits and has a queue) for every PR while still proving
# the app boots on a real Android image. If the prebuild + gradle path
# turns out to be too brittle (autolink drift, RN version churn), the
# fallback is to flip this to consume an EAS preview build artifact via
# `eas build --local` or an internal channel — left for a future pass.
#
# Trigger surface is intentionally narrow: PRs touching apps/mobile/** and
# manual dispatch. The fast PR gate stays in frontend.yml.

name: mobile-e2e

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-e2e.yml"
  workflow_dispatch:

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: android api ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v7

      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: install workspace deps
        run: npm ci

      - name: install maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: maestro version
        run: maestro --version

      - name: expo prebuild (android)
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install --non-interactive

      # Release, not debug, on purpose. A React Native debug APK loads its JS
      # bundle from a Metro dev server at runtime; nothing here starts Metro, so
      # a debug build launched to an empty surface and every flow failed on its
      # first assertion. A release build embeds the bundle, which is what an
      # unattended E2E run needs. Expo's android template signs release with the
      # debug keystore unless a real one is configured, so no secret is required.
      - name: gradle assembleRelease
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: locate apk
        id: locate-apk
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "no release apk found"
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "found apk: $APK"

      - name: run maestro on android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r "${{ steps.locate-apk.outputs.apk }}"
            # reactivecircus/android-emulator-runner runs each line in its own shell, so a
            # bare `cd apps/mobile` on the previous line does not carry over and maestro
            # looked for .maestro/ at the repo root ("Flow path does not exist"). Keep the
            # cd and the test in one command.
            cd apps/mobile && maestro test .maestro/level-1-walkthrough.yaml --debug-output maestro-debug-output

      - name: upload maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-output-api-${{ matrix.api-level }}
          path: apps/mobile/maestro-debug-output
          if-no-files-found: ignore
          retention-days: 14
