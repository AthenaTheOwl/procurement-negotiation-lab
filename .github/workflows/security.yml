name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * 1"

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: sync
        run: uv sync --python 3.11 --all-groups
      - name: bandit
        run: uv run bandit -q -r src
      - name: pip-audit
        run: uv run pip-audit --skip-editable
