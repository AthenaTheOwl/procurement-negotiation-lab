name: engine-properties

on:
  pull_request:
    paths:
      - "src/procurement_lab/**"
      - "tests/property/**"
      - "packages/engine/**"
      - "specs/0017-engine-property-test-battery/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "src/procurement_lab/**"
      - "tests/property/**"
      - "packages/engine/**"
      - "specs/0017-engine-property-test-battery/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"

jobs:
  property-battery:
    name: property battery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: sync
        run: uv sync --python 3.11
      - name: property battery
        run: uv run pytest tests/property/ -q --no-cov
      - name: upload hypothesis failure bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-failures
          path: .hypothesis/
          if-no-files-found: ignore

  ts-engine-mirror:
    name: TypeScript engine mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: install
        run: npm ci
      - name: typecheck engine
        run: npm run lint --workspace=@lab/engine
      - name: weighted-Nash mirror tests
        run: npm run test --workspace=@lab/engine -- src/model/weightedNash.test.ts
