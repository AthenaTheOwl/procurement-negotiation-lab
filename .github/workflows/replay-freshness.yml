name: replay-freshness

# Replays the canonical sample on a fixed schedule and commits the dated
# replay record, so the replay-equivalence claim is re-checked twice a
# month instead of when someone remembers (DEC-FACTORY-020).
#
# The replay sequence is the one in `.github/workflows/run-evidence-gates.yml`:
# save today's finalized Run record and `scripts/replay_run.py`, check out the
# recorded sandbox SHA, restore the two saved files, replay. `replay_run.py`
# is HEAD-strict, so the replay has to run in this clone at that SHA (not in
# a `git worktree`). Only run-960d6b107160 is replayable this way; the Run
# records that still carry `@PENDING` stay PENDING.
#
# The only addition is what happens after a replay that exits 0: restore the
# two overlaid paths, return to main, and commit the new replay record plus
# its per-replay ledger, and nothing else. A replay that fails commits
# nothing and opens an issue.

on:
  schedule:
    - cron: "17 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: replay-freshness
  cancel-in-progress: false

env:
  CANONICAL_SAMPLE: run-960d6b107160
  DEFAULT_BRANCH: main
  # The replay commit (and a rebase, if main moves mid-run) is made as the Actions bot.
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  replay-and-commit:
    name: replay canonical sample and commit the record
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out procurement-negotiation-lab
        uses: actions/checkout@v4
        with:
          path: procurement-negotiation-lab
          ref: main
          fetch-depth: 0

      - name: Check out trace-to-eval-harness (sibling)
        uses: actions/checkout@v4
        with:
          repository: AthenaTheOwl/trace-to-eval-harness
          path: trace-to-eval-harness

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install trace-to-eval-harness (editable, with deps)
        working-directory: trace-to-eval-harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Save finalized replay inputs before checkout
        working-directory: procurement-negotiation-lab
        run: |
          cp ops/run-records/${CANONICAL_SAMPLE}.json /tmp/run-record-finalized.json
          cp scripts/replay_run.py /tmp/replay_run-current.py

      - name: Extract sandbox SHA from canonical Run record
        id: sandbox
        working-directory: procurement-negotiation-lab
        run: |
          SANDBOX_URI=$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["sandbox_image_ref"])' ops/run-records/${CANONICAL_SAMPLE}.json)
          echo "sandbox uri: ${SANDBOX_URI}"
          SANDBOX_SHA=$(echo "${SANDBOX_URI}" | sed -E 's|^repo://[^@]+@([a-f0-9]{40})/.*|\1|')
          if [ -z "${SANDBOX_SHA}" ] || [ "${SANDBOX_SHA}" = "${SANDBOX_URI}" ]; then
            echo "could not extract 40-char SHA from sandbox_image_ref ${SANDBOX_URI}"
            exit 1
          fi
          echo "sandbox sha: ${SANDBOX_SHA}"
          echo "sha=${SANDBOX_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Check out recorded sandbox SHA
        working-directory: procurement-negotiation-lab
        run: |
          git checkout ${{ steps.sandbox.outputs.sha }}

      - name: Restore finalized replay inputs into worktree
        working-directory: procurement-negotiation-lab
        run: |
          cp /tmp/run-record-finalized.json ops/run-records/${CANONICAL_SAMPLE}.json
          cp /tmp/replay_run-current.py scripts/replay_run.py

      - name: Replay smoke (canonical sample)
        working-directory: procurement-negotiation-lab
        run: |
          python scripts/replay_run.py --run-id ${CANONICAL_SAMPLE}

      - name: Return to main and stage only the new replay record and ledger
        working-directory: procurement-negotiation-lab
        run: |
          set -euo pipefail
          mapfile -t NEW_REPORTS < <(git ls-files --others --exclude-standard -- "ops/replay-records/${CANONICAL_SAMPLE}/")
          mapfile -t NEW_LEDGERS < <(git ls-files --others --exclude-standard -- "ops/event-ledger/replay-${CANONICAL_SAMPLE}-*.jsonl")
          if [ "${#NEW_REPORTS[@]}" -ne 1 ] || [ "${#NEW_LEDGERS[@]}" -ne 1 ]; then
            echo "expected one new replay record and one new replay ledger; found ${NEW_REPORTS[*]:-no record} / ${NEW_LEDGERS[*]:-no ledger}" >&2
            exit 1
          fi
          NEW_REPORT="${NEW_REPORTS[0]}"
          NEW_LEDGER="${NEW_LEDGERS[0]}"
          # The ledger event must point at this report, and the evidence quorum
          # ages a record by finished_at; refuse to commit a pair that fails either.
          python - "$NEW_REPORT" "$NEW_LEDGER" <<'PY'
          import json, sys
          report_path, ledger_path = sys.argv[1], sys.argv[2]
          report = json.load(open(report_path, encoding="utf-8"))
          event = json.loads(open(ledger_path, encoding="utf-8").readline())
          problems = []
          if report.get("replay_equivalent") is not True:
              problems.append("report is not replay_equivalent")
          if not report.get("finished_at"):
              problems.append("report carries no finished_at")
          if event.get("payload", {}).get("packet_ref") != report_path:
              problems.append(f"ledger packet_ref {event.get('payload', {}).get('packet_ref')!r} != {report_path!r}")
          sys.exit("; ".join(problems) or None)
          PY
          cp "$NEW_REPORT" "$RUNNER_TEMP/new-replay-record.json"
          cp "$NEW_LEDGER" "$RUNNER_TEMP/new-replay-ledger.jsonl"
          # Restore the two overlaid paths so the branch switch is clean.
          for path in "ops/run-records/${CANONICAL_SAMPLE}.json" scripts/replay_run.py; do
            if git cat-file -e "HEAD:$path" 2>/dev/null; then
              git checkout HEAD -- "$path"
            else
              rm -f "$path"
            fi
          done
          git checkout "$DEFAULT_BRANCH"
          mkdir -p "$(dirname "$NEW_REPORT")"
          cp "$RUNNER_TEMP/new-replay-record.json" "$NEW_REPORT"
          cp "$RUNNER_TEMP/new-replay-ledger.jsonl" "$NEW_LEDGER"
          git add -- "$NEW_REPORT" "$NEW_LEDGER"
          STAGED=$(git diff --cached --name-only | sort)
          EXPECTED=$(printf '%s\n' "$NEW_REPORT" "$NEW_LEDGER" | sort)
          if [ "$STAGED" != "$EXPECTED" ]; then
            echo "staged set differs from the two replay files:" >&2
            echo "$STAGED" >&2
            exit 1
          fi
          git commit -m "ops: scheduled replay of ${CANONICAL_SAMPLE}"
          git show --stat --format='%h %s' HEAD

      - name: Push the replay commit
        working-directory: procurement-negotiation-lab
        run: |
          set -euo pipefail
          if ! git push origin "HEAD:${DEFAULT_BRANCH}"; then
            # main moved while the replay ran; the commit only adds two new files, so a rebase cannot conflict.
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi

      - name: Open an issue when the scheduled replay fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "Scheduled replay failed on $(date -u +%Y-%m-%d)" \
            --body "The replay-freshness workflow did not commit a replay record. No new record landed, so the 30-day evidence window keeps shrinking. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
