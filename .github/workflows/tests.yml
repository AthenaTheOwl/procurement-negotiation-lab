name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: sync
        run: uv sync --python 3.11
      - name: pytest
        run: uv run pytest
      - name: ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy src
      - name: spec check
        run: uv run python scripts/spec_check.py
