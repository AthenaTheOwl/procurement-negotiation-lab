name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: sync
        run: uv sync --python 3.11
      - name: install cdcp gate deps
        run: uv pip install "jsonschema>=4.21" "pyyaml>=6.0"
      - name: pytest
        run: uv run pytest
      - name: ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy src
      - name: voice lint
        run: uv run python scripts/voice_lint.py
      - name: spec check
        run: uv run python scripts/spec_check.py
      - name: validate decisions
        run: uv run python scripts/validate_decisions.py
      - name: validate roles
        run: uv run python scripts/validate_roles.py
      - name: validate tools
        run: uv run python scripts/validate_tools.py
      - name: validate policies
        run: uv run python scripts/validate_policies.py
      - name: validate skills
        run: uv run python scripts/validate_skills.py
      - name: validate dreams
        run: uv run python scripts/validate_dreams.py
      - name: check schema cache freshness
        run: uv run python scripts/check_schema_cache_freshness.py
