id: batch4-negotiation-mechanism-replay
title: Negotiation Mechanism Replay v0.1 data report
target_repo: E:/claude_code/random-apps/negotiation-mechanism-replay
goal: "Ship Negotiation Mechanism Replay as a useful v0.1 data-report repo. The repo\
  \ must have a\nclear product brief, system map, specs/0002-design ledger, runnable\n\
  Python CLI, tests, and one checked-in report artifact.\n\nSTATUS.md section convention\
  \ (REQUIRED \u2014 contract gate fails otherwise):\n- `STATUS.md` MUST have these\
  \ THREE H2 sections, with these EXACT\n  headings (case- and word-sensitive):\n\n\
  \      ## Current state\n      ## Known limits\n      ## Next feature queue\n\n\
  \  Do NOT rename to \"Shipped\" / \"Done\" / \"Next\" / \"TODO\" / \"Roadmap\" \u2014\
  \n  the contract gate matches the literal strings above. Section bodies\n  are bullet\
  \ lists; the \"Next feature queue\" body becomes the input\n  to the next factory\
  \ run for this repo.\n\nPython packaging convention (REQUIRED \u2014 `python -m\
  \ uv sync` + tests\nsilently break otherwise):\n- In `pyproject.toml`, declare dev\
  \ deps under `[dependency-groups]`,\n  NOT `[project.optional-dependencies]`. uv\
  \ installs dependency-groups\n  automatically; optional-dependencies need an explicit\
  \ `--extra` flag\n  and won't reach the venv on a plain `uv sync`.\n- Add `[tool.uv]`\
  \ with `package = true` so the project itself is\n  editable-installed into the\
  \ venv. Without it, `python -m uv run\n  pytest` falls back to the system python\
  \ and `from negotiation-mechanism-replay import X`\n  raises ModuleNotFoundError\
  \ even though the package exists on disk.\n- Build backend can be hatchling or setuptools\
  \ \u2014 either works once\n  the two uv blocks above are present.\n"
active: true
template: data-report
product_vision: Turns one public-data question into a small runnable report with a
  clear next action.
target_user: operator or analyst who needs a first-pass data report
first_user_action: python -m negotiation_mechanism_replay validate
system_layers:
- ingest
- model
- report
next_feature_queue:
- Add live source fetching with polite rate limits.
- Add a second report scenario and compare outputs.
gates:
- name: contract-presence
  cmd: python -c "from pathlib import Path; required=['PRODUCT_BRIEF.md','SYSTEM_MAP.md','STATUS.md','README.md','pyproject.toml'];
    missing=[p for p in required if not Path(p).exists()]; raise SystemExit('missing
    '+','.join(missing) if missing else 0)"
- name: reports-present
  cmd: python -c "from pathlib import Path; reports=Path('reports'); raise SystemExit(0
    if reports.exists() and any(reports.glob('*.jsonl')) else 'missing reports/*.jsonl')"
- name: pyproject-uv-conventions
  must_pass: false
  cmd: 'python -c "from pathlib import Path; t=Path(''pyproject.toml'').read_text(encoding=''utf-8'');
    flags=[]; (''[project.optional-dependencies]'' in t and ''dev'' in t.split(''[project.optional-dependencies]'')[1].split(''['')[0])
    and flags.append(''dev under optional-deps -- move to dependency-groups''); (''hatchling''
    in t and ''[tool.uv]'' not in t) and flags.append(''hatchling without tool.uv
    package=true''); raise SystemExit(''pyproject warnings - ''+''; ''.join(flags)
    if flags else 0)"

    '
review:
  reviewer: claude_code
  reviewers:
  - claude_code
  max_patch_rounds: 2
pr:
  open: false
planner: claude_code
implementer: codex
expected_artifacts:
- path: PRODUCT_BRIEF.md
- path: SYSTEM_MAP.md
- path: STATUS.md
- path: README.md
- path: pyproject.toml
- path: specs/0002-design/requirements.md
- path: specs/0002-design/design.md
- path: specs/0002-design/tasks.md
- path: specs/0002-design/acceptance.md
- path: negotiation_mechanism_replay/cli.py
- path: tests
  kind: dir
- path: reports/*.jsonl
  kind: glob
module_map:
- name: cli
  source: negotiation_mechanism_replay/cli.py
  layer: ingest
  public_interfaces:
  - 'main(argv: list[str] | None = None) -> int'
- name: model
  source: negotiation_mechanism_replay/model.py
  layer: model
  public_interfaces:
  - 'rank_constraints(plan: CapexPlan) -> list[FactorScore]'
- name: report
  source: negotiation_mechanism_replay/scoring.py
  layer: report
  public_interfaces:
  - 'write_report(scores: list[FactorScore], path: Path) -> Path'
